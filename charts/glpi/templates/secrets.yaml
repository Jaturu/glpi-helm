{{- /*
  Chart-managed Secret. Values are generated on first install, reused on
  upgrades (lookup), and the Secret is kept on uninstall so the database
  passwords are never lost by accident. GLPI's own encryption keys are files
  on the data volume (config/), not a Secret.
*/ -}}
{{- if and .Values.mariadb.enabled (not .Values.mariadb.auth.existingSecret) }}
{{- $name := include "glpi.mariadb.secretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "glpi.labels" (dict "ctx" $ "component" "mariadb") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.mariadb.auth.passwordKey }}: {{ include "glpi.secretValue" (dict "ctx" $ "name" $name "key" .Values.mariadb.auth.passwordKey "length" 32) }}
  {{ .Values.mariadb.auth.rootPasswordKey }}: {{ include "glpi.secretValue" (dict "ctx" $ "name" $name "key" .Values.mariadb.auth.rootPasswordKey "length" 32) }}
{{- end }}
