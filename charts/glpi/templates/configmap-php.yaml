{{- /*
  PHP settings generated by the chart. Mounted at /etc/glpi/php.d, which the
  image scans after its own conf.d, so these override the image defaults.
*/ -}}
{{- $n := int .Values.glpi.uploadLimitMB }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "glpi.fullname" . }}-php
  labels:
    {{- include "glpi.labels" (dict "ctx" $ "component" "app") | nindent 4 }}
data:
  zz-chart.ini: |
    ; Generated by the glpi Helm chart, do not edit in the pod.
    ; Upload limits derived from glpi.uploadLimitMB ({{ $n }} MB).
    upload_max_filesize = {{ $n }}M
    post_max_size       = {{ add $n 5 }}M
    date.timezone       = {{ .Values.glpi.timezone }}
    {{- if hasPrefix "https://" .Values.glpi.url }}
    ; glpi.url is https, so the session cookie is sent over TLS only.
    session.cookie_secure = On
    {{- end }}
    {{- with .Values.php.extraIni }}

    ; php.extraIni
    {{- . | nindent 4 }}
    {{- end }}
