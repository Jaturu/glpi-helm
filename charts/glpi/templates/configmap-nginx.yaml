apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "glpi.fullname" . }}-nginx
  labels:
    {{- include "glpi.labels" (dict "ctx" $ "component" "app") | nindent 4 }}
data:
  glpi.conf: |
    # Application server, exposed by the Service.
    server {
        listen {{ .Values.nginx.port }};
        server_name _;
        server_tokens off;

        # public/ is copied from the image into an emptyDir by an init
        # container. It is the only part of GLPI nginx can read.
        root /var/www/glpi/public;

        client_max_body_size {{ add (int .Values.glpi.uploadLimitMB) 5 }}m;

        gzip on;
        gzip_types text/css application/javascript image/svg+xml application/json;

        # Dotfiles are denied, except the /.well-known/ routes GLPI answers.
        location ~ /\.(?!well-known/) { deny all; }

        # Existing static files are served directly. Everything else
        # (/front/*.php, /ajax/*.php, the APIs, plugin files) goes to GLPI's
        # front controller, which does its own routing and access checks.
        location / {
            try_files $uri /index.php$is_args$args;
        }

        # The only executable script. public/ holds no other PHP file.
        location = /index.php {
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/glpi/public/index.php;
            fastcgi_param DOCUMENT_ROOT   /var/www/glpi/public;
            fastcgi_read_timeout 600s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }
    }

    # Health server: kubelet probes only, not exposed by the Service.
    server {
        listen {{ .Values.probes.healthPort }};
        server_name _;
        server_tokens off;
        access_log off;

        location = /fpm-ping {
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_NAME     /fpm-ping;
            fastcgi_param SCRIPT_FILENAME /fpm-ping;
        }

        location / { return 404; }
    }
