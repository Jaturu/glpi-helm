{{- /*
  GLPI constants, rendered as config/local_define.php. GLPI loads that file
  before the image's inc/downstream.php, which sets the data paths. Each value
  is passed as JSON and decoded by PHP, so strings need no PHP escaping here.
*/ -}}
{{- $g := .Values.glpi }}
{{- $managed := dict }}
{{- if $g.trustedProxies }}
{{- $_ := set $managed "GLPI_TRUSTED_REVERSE_PROXIES" $g.trustedProxies }}
{{- $_ := set $managed "GLPI_REVERSE_PROXY_HEADERS" $g.reverseProxyHeaders }}
{{- end }}
{{- $reserved := list "GLPI_TRUSTED_REVERSE_PROXIES" "GLPI_REVERSE_PROXY_HEADERS" }}
{{- $paths := list "GLPI_CONFIG_DIR" "GLPI_VAR_DIR" "GLPI_LOG_DIR" "GLPI_MARKETPLACE_DIR" }}
{{- range $k, $_ := $g.constants }}
{{- if not (regexMatch "^GLPI_[A-Z0-9_]+$" $k) }}
{{- fail (printf "glpi.constants.%s is not a GLPI constant name (GLPI_ followed by capitals, digits or underscores)" $k) }}
{{- end }}
{{- if has $k $reserved }}
{{- fail (printf "glpi.constants.%s is set by the chart from glpi.trustedProxies / glpi.reverseProxyHeaders, set those instead" $k) }}
{{- end }}
{{- if has $k $paths }}
{{- fail (printf "glpi.constants.%s is a data path fixed by the image and the chart's volume mounts" $k) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "glpi.fullname" . }}-config
  labels:
    {{- include "glpi.labels" (dict "ctx" $ "component" "app") | nindent 4 }}
data:
  local_define.php: |
    <?php
    // Generated by the glpi Helm chart, do not edit in the pod.
    {{- range $k, $v := (merge (dict) $managed $g.constants) }}
    define('{{ $k }}', json_decode('{{ $v | toJson | replace "\\" "\\\\" | replace "'" "\\'" }}', true));
    {{- end }}
