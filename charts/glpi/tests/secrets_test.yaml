suite: chart-managed secrets
templates:
  - secrets.yaml
release:
  name: desk
tests:
  - it: creates only the MariaDB Secret by default
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: desk-glpi-mariadb }

  - it: keeps the Secret on uninstall
    asserts:
      - equal:
          path: 'metadata.annotations["helm.sh/resource-policy"]'
          value: keep

  - it: generates both MariaDB passwords
    asserts:
      - exists: { path: 'data["mariadb-password"]' }
      - exists: { path: 'data["mariadb-root-password"]' }

  - it: reuses existing values on upgrade
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr: { version: v1, resource: secrets }
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata: { name: desk-glpi-mariadb, namespace: NAMESPACE }
          data: { mariadb-password: VVNFUg==, mariadb-root-password: Uk9PVA== }
    asserts:
      - equal: { path: 'data["mariadb-password"]', value: VVNFUg== }
      - equal: { path: 'data["mariadb-root-password"]', value: Uk9PVA== }

  - it: creates no Secret when MariaDB is disabled
    set:
      mariadb.enabled: false
    asserts:
      - hasDocuments: { count: 0 }

  - it: creates no Secret when an existing one is given
    set:
      mariadb.auth.existingSecret: my-db
    asserts:
      - hasDocuments: { count: 0 }
