; GLPI PHP settings.
; Installed as /etc/php84/conf.d/99-glpi.ini, which Alpine's php-fpm and CLI
; both read, so php-fpm, bin/console and cron behave the same.

; Uploads: keep in step with nginx client_max_body_size in the chart.
upload_max_filesize = 50M
post_max_size       = 55M
memory_limit        = 256M
max_execution_time  = 600

expose_php    = Off
date.timezone = UTC

; Session cookie hardening GLPI checks for. cookie_secure is set by the chart
; when the public URL is https.
session.cookie_httponly = On
session.cookie_samesite = Lax
session.use_trans_sid   = Off
session.auto_start      = Off

; Application code is immutable in the image, so skip file stat checks.
; A new image means a new pod and a fresh opcache.
opcache.enable                  = 1
opcache.memory_consumption      = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files   = 40000
opcache.validate_timestamps     = 0
